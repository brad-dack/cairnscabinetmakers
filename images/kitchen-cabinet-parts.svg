<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d">
  <title id="t">Diagram naming the parts of a kitchen base cabinet</title>
  <desc id="d">A base cabinet drawn from the front, with the door closed on the left and the inside shown on the right. Labels name the benchtop, carcass, shelf and kickboard on the right, and the hinge, door and edge on the left.</desc>
  <rect width="1200" height="800" fill="#e9eef2"/>
  <g transform="translate(60 0)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="600" fill="#33414d">
    <!-- carcass: the box, with its two side panels -->
    <rect x="260" y="225" width="440" height="415" fill="#dfe7ec" stroke="#8da2b0" stroke-width="6"/>
    <rect x="260" y="225" width="22" height="415" fill="#f4f7f9" stroke="#8da2b0" stroke-width="6"/>
    <rect x="678" y="225" width="22" height="415" fill="#f4f7f9" stroke="#8da2b0" stroke-width="6"/>
    <!-- inside, shown on the right: back panel and one shelf -->
    <rect x="490" y="252" width="188" height="376" fill="#eef2f5" stroke="#8da2b0" stroke-width="4"/>
    <rect x="490" y="450" width="188" height="16" fill="#ffffff" stroke="#8da2b0" stroke-width="5"/>
    <!-- door, closed, on the left -->
    <rect x="290" y="252" width="196" height="376" fill="#ffffff" stroke="#8da2b0" stroke-width="6"/>
    <rect x="450" y="330" width="10" height="100" rx="5" fill="#8da2b0"/>
    <!-- door edges, finished with a thin edge strip -->
    <rect x="290" y="252" width="196" height="5" fill="#0b6e4f"/>
    <rect x="290" y="623" width="196" height="5" fill="#0b6e4f"/>
    <rect x="481" y="252" width="5" height="376" fill="#0b6e4f"/>
    <!-- hinges on the door's left edge -->
    <rect x="282" y="272" width="26" height="34" rx="4" fill="#8da2b0"/>
    <rect x="282" y="574" width="26" height="34" rx="4" fill="#8da2b0"/>
    <!-- kickboard and benchtop -->
    <rect x="282" y="640" width="396" height="60" fill="#b9c7d1" stroke="#8da2b0" stroke-width="6"/>
    <rect x="235" y="175" width="490" height="50" rx="6" fill="#c9d5dd" stroke="#8da2b0" stroke-width="6"/>

    <!-- labels on the right -->
    <g stroke="#33414d" stroke-width="4" fill="#33414d">
      <line x1="700" y1="200" x2="770" y2="200"/><circle cx="700" cy="200" r="7" stroke="none"/>
      <line x1="689" y1="330" x2="770" y2="330"/><circle cx="689" cy="330" r="7" stroke="none"/>
      <line x1="640" y1="458" x2="770" y2="458"/><circle cx="640" cy="458" r="7" stroke="none"/>
      <line x1="640" y1="670" x2="770" y2="670"/><circle cx="640" cy="670" r="7" stroke="none"/>
    </g>
    <text x="785" y="213" stroke="none">Benchtop</text>
    <text x="785" y="343" stroke="none">Carcass</text>
    <text x="785" y="471" stroke="none">Shelf</text>
    <text x="785" y="683" stroke="none">Kickboard</text>

    <!-- labels on the left -->
    <g stroke="#33414d" stroke-width="4" fill="#33414d">
      <line x1="190" y1="289" x2="295" y2="289"/><circle cx="295" cy="289" r="7" stroke="none"/>
      <line x1="190" y1="420" x2="360" y2="420"/><circle cx="360" cy="420" r="7" stroke="none"/>
      <line x1="190" y1="625" x2="360" y2="625"/><circle cx="360" cy="625" r="7" stroke="none"/>
    </g>
    <text x="175" y="302" text-anchor="end" stroke="none">Hinge</text>
    <text x="175" y="433" text-anchor="end" stroke="none">Door</text>
    <text x="175" y="638" text-anchor="end" stroke="none">Edge</text>
  </g>
</svg>
